# Provisions a fresh Azure resource group + IoT Hub / DPS / devices (optionally
# Device Update) and writes a test-config script for the consumer.
#
# This is the GitHub Actions face of
# vsts/templates/steps-provision-e2e-resources.yaml: both call the SAME
# AzIotSdkTest function, New-AzIotE2ETestEnvironmentAndConfig. The action does
# not download the module: the runner already checked this repository out to
# run the action, so the module is the commit this action was pinned to.
#
# The caller must run `azure/login` BEFORE this step.
#
# Usage:
#   - uses: Azure/iot-sdks-e2e-fx/actions/provision-e2e-resources@<ref>
#     with:
#       rg-name: MyE2E-${{ github.run_id }}-${{ github.run_attempt }}
#       config-cmdlet: New-AzIotCSDKE2ETestConfig
name: Provision e2e Azure resources
description: Provision a resource group + IoT Hub/DPS/devices (optionally ADU) and emit a test-config script.

inputs:
  rg-name:
    description: >-
      Exact resource group name to provision into. PREFERRED over `rg-prefix`: a caller that
      derives the name from the run itself (e.g. CSDKE2EFast-<run_id>-<run_attempt>) can compute
      the same name in its teardown job WITHOUT reading this action's `resource-group` output --
      which a CANCELLED provisioning job never publishes, orphaning the group. When empty, falls
      back to `rg-prefix` + a random GUID.
    required: false
    default: ''
  rg-prefix:
    description: >-
      Resource group name prefix (e.g. CSDKE2EFast-) used to generate a random name. Ignored when
      `rg-name` is set. Required only when `rg-name` is empty.
    required: false
    default: ''
  azure-location:
    description: >-
      Azure region to provision in. ADU is only available in a subset (EastUS);
      certificate management (ADR) is available in EastUS too. Avoid canary
      regions (e.g. centraluseuap): Microsoft.DeviceRegistry there rejects
      namespace creation from the CI service principal with
      400 ResourceCreationValidateFailed.
    required: false
    default: EastUS
  enable-adu:
    description: >-
      New-AzIotTestEnvironment -EnableADU value (None|Gen1|Gen2). Anything other than 'None'
      requires a module build that exposes -EnableADU; the step fails with an explicit message
      if it does not, instead of a parameter-binding error.
    required: false
    default: None
  enable-certificate-management:
    description: >-
      When 'true', pass -EnableCertificateManagement to New-AzIotTestEnvironment so DPS is
      provisioned with Azure Device Registration (ADR) integration -- the enrollments can then
      issue an operational certificate in response to a device CSR (required by the CSR e2e).
    required: false
    default: 'false'
  disable-local-auth:
    description: >-
      When 'true', pass -DisableLocalAuth to New-AzIotTestEnvironment so the IoT Hub only takes
      Microsoft Entra ID on its service APIs: the signed-in principal is granted IoT Hub Data
      Contributor on it and DPS links to it with its own identity. Device SAS and X.509 keep
      working, as does the built-in Event Hub connection string; the IoT Hub connection string
      in the test config is then usable for its HostName only.
    required: false
    default: 'false'
  enable-file-upload:
    description: >-
      When 'true', pass -EnableFileUpload to New-AzIotTestEnvironment so an Azure Storage account
      is created and associated with the IoT Hub for file upload (required by the file-upload
      e2e), and turn on the hub's file-upload NOTIFICATIONS. With certificate management, both
      are set when the hub is created, before it is linked to ADR.
    required: false
    default: 'false'
  route-telemetry-to-event-hub:
    description: >-
      When 'true', pass -RouteTelemetryToEventHub to New-AzIotTestEnvironment so device telemetry
      is routed to an Event Hub with local authentication disabled, read with a Microsoft Entra
      token. That is how tests read telemetry when disable-local-auth is 'true': the built-in
      Event Hub-compatible endpoint takes only shared access keys.
    required: false
    default: 'false'
  telemetry-event-hub-consumer-groups:
    description: >-
      Comma-separated consumer groups to create on that Event Hub besides $Default, e.g. one per
      parallel test job (e2e-0,e2e-1). Requires route-telemetry-to-event-hub.
    required: false
    default: ''
  iothub-x509-thumbprint-devices:
    description: Number of x509-thumbprint IoT Hub devices to create.
    required: false
    default: '1'
  dps-x509-individual-enrollments:
    description: Number of DPS x509 individual enrollments to create.
    required: false
    default: '1'
  dps-x509-group-enrollment-devices:
    description: >-
      Number of devices for a DPS x509 ENROLLMENT GROUP linked to the provisioned signing CA
      (New-AzIotTestEnvironment -DpsX509GroupEnrollmentDevices). A value > 0 creates the group and
      makes this action emit one bootstrap identity per device as IOT_DPS_GROUP_X509_CERTIFICATE_<i> (leaf +
      issuer CA + root), IOT_DPS_GROUP_X509_KEY_<i> and IOT_DPS_GROUP_X509_REGISTRATION_ID_<i>, and device 0
      also without the _<i> suffix; that is
      what the CSR e2e needs. Note PROVISIONING_ROOT_CERT(_KEY), written by the config cmdlets, is
      the DPS ROOT CA and NOT the group's issuer, which is an intermediate signed by that root.
    required: false
    default: '0'
  dps-symmkey-group-enrollment-devices:
    description: >-
      Number of devices for a DPS symmetric-key ENROLLMENT GROUP
      (New-AzIotTestEnvironment -DpsSymmKeyGroupEnrollmentDevices). A value > 0 creates the group,
      linked to the signing CA when certificate management is enabled; the C config cmdlet then
      emits IOT_DPS_SYMM_KEY_GROUP_ENROLLMENT_ID and IOT_DPS_SYMM_KEY_GROUP_PRIMARY_KEY.
    required: false
    default: '0'
  config-cmdlet:
    description: Cmdlet that renders the per-pipeline test config (e.g. New-AzIotCSDKE2ETestConfig).
    required: false
    default: New-AzIotCSDKE2ETestConfig
  config-target:
    description: Test-config target shell (powershell|bash).
    required: false
    default: powershell
  out-file:
    description: Path to write the generated test-config script to.
    required: false
    default: test_config/set_test_env_vars.ps1
  az-ps-version:
    description: azPSVersion passed to azure/powershell.
    required: false
    default: latest

outputs:
  resource-group:
    description: Name of the provisioned resource group (for teardown).
    value: ${{ steps.provision.outputs.rg }}

runs:
  using: composite
  steps:
    - name: Provision resources
      id: provision
      uses: azure/powershell@f5b8adcfff1904872c7b98d4012d4914d74b1a82 # v3.0.0
      env:
        # EVERY input is passed as env, never string-interpolated into the
        # script body, so an input is always data and never code.
        AZ_IOT_MODULE: ${{ github.action_path }}/../../scripts/AzIotSdkTest/AzIotSdkTest.psd1
        AZ_IOT_RG_NAME: ${{ inputs.rg-name }}
        AZ_IOT_RG_PREFIX: ${{ inputs.rg-prefix }}
        AZ_IOT_LOCATION: ${{ inputs.azure-location }}
        AZ_IOT_ENABLE_ADU: ${{ inputs.enable-adu }}
        AZ_IOT_ENABLE_CERT_MGMT: ${{ inputs.enable-certificate-management }}
        AZ_IOT_ENABLE_FILE_UPLOAD: ${{ inputs.enable-file-upload }}
        AZ_IOT_DISABLE_LOCAL_AUTH: ${{ inputs.disable-local-auth }}
        AZ_IOT_ROUTE_TELEMETRY: ${{ inputs.route-telemetry-to-event-hub }}
        AZ_IOT_TELEMETRY_CONSUMER_GROUPS: ${{ inputs.telemetry-event-hub-consumer-groups }}
        AZ_IOT_HUB_X509_DEVICES: ${{ inputs.iothub-x509-thumbprint-devices }}
        AZ_IOT_DPS_INDIVIDUAL: ${{ inputs.dps-x509-individual-enrollments }}
        AZ_IOT_DPS_GROUP_DEVICES: ${{ inputs.dps-x509-group-enrollment-devices }}
        AZ_IOT_DPS_SK_GROUP_DEVICES: ${{ inputs.dps-symmkey-group-enrollment-devices }}
        AZ_IOT_CONFIG_CMDLET: ${{ inputs.config-cmdlet }}
        AZ_IOT_CONFIG_TARGET: ${{ inputs.config-target }}
        AZ_IOT_OUT_FILE: ${{ inputs.out-file }}
      with:
        azPSVersion: ${{ inputs.az-ps-version }}
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          Import-Module $env:AZ_IOT_MODULE

          function Get-CountInput([string]$Name, [string]$Value) {
              # TryParse rather than a regex plus a cast: a digits-only value above
              # Int32.MaxValue passes '^\d+$' and then fails at the cast with a
              # generic conversion error that does not name the input.
              $Parsed = 0
              if (-not [int]::TryParse($Value, [ref]$Parsed) -or $Parsed -lt 0) {
                  throw "$Name must be an integer between 0 and $([int]::MaxValue); got '$Value'."
              }
              return $Parsed
          }

          function Get-BooleanInput([string]$Name, [string]$Value) {
              # Anything other than the exact string 'true' would otherwise be
              # silently treated as false, so 'enable-file-upload: tru' would
              # provision without file upload instead of failing.
              switch ($Value) {
                  'true' { return $true }
                  'false' { return $false }
                  default { throw "$Name must be 'true' or 'false'; got '$Value'." }
              }
          }

          $ConsumerGroups = @("$env:AZ_IOT_TELEMETRY_CONSUMER_GROUPS".Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })

          # New-AzIotE2ETestEnvironmentAndConfig checks the rest (enable-adu,
          # config-cmdlet, config-target, out-file) before anything touches Azure.
          $Arguments = @{
              AzureLocation                    = $env:AZ_IOT_LOCATION
              EnableADU                        = $env:AZ_IOT_ENABLE_ADU
              EnableCertificateManagement      = Get-BooleanInput 'enable-certificate-management' $env:AZ_IOT_ENABLE_CERT_MGMT
              EnableFileUpload                 = Get-BooleanInput 'enable-file-upload' $env:AZ_IOT_ENABLE_FILE_UPLOAD
              DisableLocalAuth                 = Get-BooleanInput 'disable-local-auth' $env:AZ_IOT_DISABLE_LOCAL_AUTH
              RouteTelemetryToEventHub         = Get-BooleanInput 'route-telemetry-to-event-hub' $env:AZ_IOT_ROUTE_TELEMETRY
              TelemetryEventHubConsumerGroups  = $ConsumerGroups
              IotHubX509ThumbprintDevices      = Get-CountInput 'iothub-x509-thumbprint-devices' $env:AZ_IOT_HUB_X509_DEVICES
              DpsX509IndividualEnrollments     = Get-CountInput 'dps-x509-individual-enrollments' $env:AZ_IOT_DPS_INDIVIDUAL
              DpsX509GroupEnrollmentDevices    = Get-CountInput 'dps-x509-group-enrollment-devices' $env:AZ_IOT_DPS_GROUP_DEVICES
              DpsSymmKeyGroupEnrollmentDevices = Get-CountInput 'dps-symmkey-group-enrollment-devices' $env:AZ_IOT_DPS_SK_GROUP_DEVICES
              ConfigCmdlet                     = $env:AZ_IOT_CONFIG_CMDLET
              ConfigTarget                     = $env:AZ_IOT_CONFIG_TARGET
              OutFile                          = $env:AZ_IOT_OUT_FILE
          }

          if (-not [string]::IsNullOrWhiteSpace($env:AZ_IOT_RG_NAME)) {
              # Caller-computed (deterministic) name -- it can reproduce this exact
              # name in teardown without depending on this job's outputs.
              # Checked here, not only by the function, because it is published
              # below: Azure allows alphanumerics, underscore, parentheses, hyphen
              # and period, up to 90 characters, not ending in a period.
              if ($env:AZ_IOT_RG_NAME -notmatch '^[A-Za-z0-9._()-]{0,89}[A-Za-z0-9_()-]\z') {
                  throw "rg-name '$($env:AZ_IOT_RG_NAME)' is not a valid Azure resource group name."
              }
              $Arguments['ResourceGroup'] = $env:AZ_IOT_RG_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:AZ_IOT_RG_PREFIX)) {
              $Arguments['ResourceGroup'] = New-AzureResourceGroupName -Prefix $env:AZ_IOT_RG_PREFIX
          } else {
              throw "Either 'rg-name' or 'rg-prefix' must be provided."
          }

          # Publish the RG name up-front so teardown can delete it even if the
          # provisioning below fails part-way through. NOTE: job outputs are NOT
          # propagated when the job is CANCELLED, so this output alone is not a
          # reliable teardown handle -- prefer a deterministic 'rg-name'.
          "rg=$($Arguments['ResourceGroup'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          New-AzIotE2ETestEnvironmentAndConfig @Arguments | Out-Null
