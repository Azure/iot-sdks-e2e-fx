# Provisions a fresh Azure resource group + IoT Hub / DPS / devices (optionally
# Device Update) and writes a test-config script for the consumer.
#
# This is the GitHub Actions face of the same work that
# vsts/templates/steps-create-azure-resources.yaml does for Azure Pipelines.
# Both call the SAME Azure.Iot.Sdk.Test module; neither downloads it, because
# the runner already checked this repository out to run the action, so the
# module is guaranteed to be the commit this action was pinned to.
#
# The caller must run `azure/login` BEFORE this step.
#
# Usage:
#   - uses: Azure/iot-sdks-e2e-fx/actions/provision-e2e-resources@<ref>
#     with:
#       rg-name: MyE2E-${{ github.run_id }}-${{ github.run_attempt }}
#       config-cmdlet: New-AzIotCSDKE2ETestConfig
name: Provision e2e Azure resources
description: Provision a resource group + IoT Hub/DPS/devices (optionally ADU) and emit a test-config script.

inputs:
  rg-name:
    description: >-
      Exact resource group name to provision into. PREFERRED over `rg-prefix`: a caller that
      derives the name from the run itself (e.g. CSDKE2EFast-<run_id>-<run_attempt>) can compute
      the same name in its teardown job WITHOUT reading this action's `resource-group` output --
      which a CANCELLED provisioning job never publishes, orphaning the group. When empty, falls
      back to `rg-prefix` + a random GUID.
    required: false
    default: ''
  rg-prefix:
    description: >-
      Resource group name prefix (e.g. CSDKE2EFast-) used to generate a random name. Ignored when
      `rg-name` is set. Required only when `rg-name` is empty.
    required: false
    default: ''
  azure-location:
    description: >-
      Azure region to provision in. ADU is only available in a subset (EastUS);
      certificate management (ADR) is available in EastUS too. Avoid canary
      regions (e.g. centraluseuap): Microsoft.DeviceRegistry there rejects
      namespace creation from the CI service principal with
      400 ResourceCreationValidateFailed.
    required: false
    default: EastUS
  enable-adu:
    description: >-
      New-AzIotTestEnvironment -EnableADU value (None|Gen1|Gen2). Anything other than 'None'
      requires a module build that exposes -EnableADU; the step fails with an explicit message
      if it does not, instead of a parameter-binding error.
    required: false
    default: None
  enable-certificate-management:
    description: >-
      When 'true', pass -EnableCertificateManagement to New-AzIotTestEnvironment so DPS is
      provisioned with Azure Device Registration (ADR) integration -- the enrollments can then
      issue an operational certificate in response to a device CSR (required by the CSR e2e).
    required: false
    default: 'false'
  enable-file-upload:
    description: >-
      When 'true', pass -EnableFileUpload to New-AzIotTestEnvironment so an Azure Storage account
      is created and associated with the IoT Hub for file upload (required by the file-upload
      e2e), and turn on the hub's file-upload NOTIFICATIONS.
    required: false
    default: 'false'
  iothub-x509-thumbprint-devices:
    description: Number of x509-thumbprint IoT Hub devices to create.
    required: false
    default: '1'
  dps-x509-individual-enrollments:
    description: Number of DPS x509 individual enrollments to create.
    required: false
    default: '1'
  dps-x509-group-enrollment-devices:
    description: >-
      Number of devices for a DPS x509 ENROLLMENT GROUP linked to the provisioned signing CA
      (New-AzIotTestEnvironment -DpsX509GroupEnrollmentDevices). A value > 0 creates the group
      whose issuer certificate is emitted as PROVISIONING_ROOT_CERT(_KEY); required for the CSR
      e2e, where the device presents a leaf signed by that CA and DPS issues its operational cert.
    required: false
    default: '0'
  config-cmdlet:
    description: Cmdlet that renders the per-pipeline test config (e.g. New-AzIotCSDKE2ETestConfig).
    required: false
    default: New-AzIotCSDKE2ETestConfig
  config-target:
    description: Test-config target shell (powershell|bash).
    required: false
    default: powershell
  out-file:
    description: Path to write the generated test-config script to.
    required: false
    default: test_config/set_test_env_vars.ps1
  az-ps-version:
    description: azPSVersion passed to azure/powershell.
    required: false
    default: latest

outputs:
  resource-group:
    description: Name of the provisioned resource group (for teardown).
    value: ${{ steps.provision.outputs.rg }}

runs:
  using: composite
  steps:
    - name: Provision resources
      id: provision
      uses: azure/powershell@v3
      env:
        # EVERY input is passed as env, never string-interpolated into the
        # script body, so an input is always data and never code.
        AZ_IOT_MODULE: ${{ github.action_path }}/../../scripts/Azure.Iot.Sdk.Test.psm1
        AZ_IOT_RG_NAME: ${{ inputs.rg-name }}
        AZ_IOT_RG_PREFIX: ${{ inputs.rg-prefix }}
        AZ_IOT_LOCATION: ${{ inputs.azure-location }}
        AZ_IOT_ENABLE_ADU: ${{ inputs.enable-adu }}
        AZ_IOT_ENABLE_CERT_MGMT: ${{ inputs.enable-certificate-management }}
        AZ_IOT_ENABLE_FILE_UPLOAD: ${{ inputs.enable-file-upload }}
        AZ_IOT_HUB_X509_DEVICES: ${{ inputs.iothub-x509-thumbprint-devices }}
        AZ_IOT_DPS_INDIVIDUAL: ${{ inputs.dps-x509-individual-enrollments }}
        AZ_IOT_DPS_GROUP_DEVICES: ${{ inputs.dps-x509-group-enrollment-devices }}
        AZ_IOT_CONFIG_CMDLET: ${{ inputs.config-cmdlet }}
        AZ_IOT_CONFIG_TARGET: ${{ inputs.config-target }}
        AZ_IOT_OUT_FILE: ${{ inputs.out-file }}
      with:
        azPSVersion: ${{ inputs.az-ps-version }}
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          Import-Module $env:AZ_IOT_MODULE

          function Get-CountInput([string]$Name, [string]$Value) {
              if ($Value -notmatch '^\d+$') {
                  throw "$Name must be a non-negative integer; got '$Value'."
              }
              return [int]$Value
          }

          $EnableAdu = $env:AZ_IOT_ENABLE_ADU
          if ($EnableAdu -notin @('None', 'Gen1', 'Gen2')) {
              throw "enable-adu must be one of None, Gen1, Gen2; got '$EnableAdu'."
          }

          $ConfigTarget = $env:AZ_IOT_CONFIG_TARGET
          if ($ConfigTarget -notin @('powershell', 'bash')) {
              throw "config-target must be 'powershell' or 'bash'; got '$ConfigTarget'."
          }

          # Resolve to a FUNCTION exported by this module, so config-cmdlet can
          # never name an arbitrary command on the agent.
          #
          # -Name is a WILDCARD pattern, so 'New-AzIot*' would return every
          # matching function; filter on an exact name and require exactly one
          # result, or `& $ConfigCmdlet` would be handed an array.
          $ConfigCmdletName = $env:AZ_IOT_CONFIG_CMDLET
          $ConfigCmdletMatches = @(
              Get-Command -Name $ConfigCmdletName -CommandType Function -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -eq $ConfigCmdletName -and $_.ModuleName -eq 'Azure.Iot.Sdk.Test' }
          )
          if ($ConfigCmdletMatches.Count -ne 1) {
              throw "config-cmdlet '$ConfigCmdletName' did not resolve to exactly one cmdlet exported by Azure.Iot.Sdk.Test (matched $($ConfigCmdletMatches.Count))."
          }
          $ConfigCmdlet = $ConfigCmdletMatches[0]

          $OutFile = $env:AZ_IOT_OUT_FILE
          if ([string]::IsNullOrWhiteSpace($OutFile)) {
              throw "out-file must not be empty."
          }
          $OutDir = Split-Path -Parent $OutFile
          if (-not [string]::IsNullOrWhiteSpace($OutDir)) {
              New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          }

          if (-not [string]::IsNullOrWhiteSpace($env:AZ_IOT_RG_NAME)) {
              # Caller-computed (deterministic) name -- it can reproduce this exact
              # name in teardown without depending on this job's outputs.
              # Azure allows alphanumerics, underscore, parentheses, hyphen and
              # period, up to 90 characters, but the name may NOT end in a period.
              # Anchored with \z, not $, so a trailing newline cannot slip through.
              if ($env:AZ_IOT_RG_NAME -notmatch '^[A-Za-z0-9._()-]{0,89}[A-Za-z0-9_()-]\z') {
                  throw "rg-name '$($env:AZ_IOT_RG_NAME)' is not a valid Azure resource group name."
              }
              $ResourceGroupName = $env:AZ_IOT_RG_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:AZ_IOT_RG_PREFIX)) {
              $ResourceGroupName = New-AzureResourceGroupName -Prefix $env:AZ_IOT_RG_PREFIX
          } else {
              throw "Either 'rg-name' or 'rg-prefix' must be provided."
          }

          # Publish the RG name up-front so teardown can delete it even if the
          # provisioning below fails part-way through. NOTE: job outputs are NOT
          # propagated when the job is CANCELLED, so this output alone is not a
          # reliable teardown handle -- prefer a deterministic 'rg-name'.
          "rg=$ResourceGroupName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $NewEnvArgs = @{
              AzureLocation                 = $env:AZ_IOT_LOCATION
              ResourceGroup                 = $ResourceGroupName
              IotHubX509ThumbprintDevices   = Get-CountInput 'iothub-x509-thumbprint-devices' $env:AZ_IOT_HUB_X509_DEVICES
              DpsX509IndividualEnrollments  = Get-CountInput 'dps-x509-individual-enrollments' $env:AZ_IOT_DPS_INDIVIDUAL
              DpsX509GroupEnrollmentDevices = Get-CountInput 'dps-x509-group-enrollment-devices' $env:AZ_IOT_DPS_GROUP_DEVICES
          }
          # Only pass -EnableADU when ADU was actually asked for: not every build of
          # the module exposes it. Passing it unconditionally turns "this module has
          # no ADU support" into an opaque parameter-binding failure at provisioning
          # time, for callers that never wanted ADU.
          #
          # validate-actions: allow-parameter EnableADU
          # (checked at runtime immediately below, because the parameter is absent
          # from the module on master and present on the ADU branch)
          if ($EnableAdu -ne 'None') {
              if (-not (Get-Command New-AzIotTestEnvironment).Parameters.ContainsKey('EnableADU')) {
                  throw "enable-adu is '$EnableAdu' but this build of Azure.Iot.Sdk.Test has no -EnableADU parameter."
              }
              $NewEnvArgs['EnableADU'] = $EnableAdu
          }
          if ($env:AZ_IOT_ENABLE_CERT_MGMT -eq 'true') { $NewEnvArgs['EnableCertificateManagement'] = $true }
          if ($env:AZ_IOT_ENABLE_FILE_UPLOAD -eq 'true') { $NewEnvArgs['EnableFileUpload'] = $true }

          $TestEnvInfo = New-AzIotTestEnvironment @NewEnvArgs

          & $ConfigCmdlet -TestEnvInfo $TestEnvInfo -Target $ConfigTarget -OutFile $OutFile

          # New-AzIotTestEnvironment -EnableFileUpload attaches the storage account
          # and container, but leaves the hub's enableFileUploadNotifications at its
          # default of FALSE. Without it IoT Hub accepts a device's completion
          # notification and then publishes nothing, so the service-side
          # file-notification endpoint stays silent and an e2e test can only verify
          # the device half of an upload. Turn it on here (the shared framework does
          # not expose a switch for it).
          if ($env:AZ_IOT_ENABLE_FILE_UPLOAD -eq 'true') {
              $HostNamePair = ($TestEnvInfo.IotHub.ConnectionString -split ';' `
                  | Where-Object { $_ -like 'HostName=*' } | Select-Object -First 1)
              if ([string]::IsNullOrWhiteSpace($HostNamePair)) {
                  throw "Could not parse HostName from the IoT Hub connection string."
              }
              $IotHubName = ($HostNamePair -replace '^HostName=', '').Split('.')[0]
              Write-Host "Enabling IoT Hub file-upload notifications ($IotHubName)"
              az iot hub update --name $IotHubName --resource-group $ResourceGroupName `
                  --fileupload-notifications true --only-show-errors | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to enable file-upload notifications on $IotHubName."
              }
          }

          # When an X.509 enrollment GROUP was provisioned, the group's issuer is
          # an INTERMEDIATE CA (created by the framework and signed by the root);
          # PROVISIONING_ROOT_CERT is NOT that issuer, so a root-signed leaf would
          # be rejected. Emit a bootstrap device identity under the group (a leaf
          # signed by the group's issuer CA) as a full chain (leaf + issuer CA +
          # root) + key + registration id, for consumers driving a CSR flow. The
          # config cmdlets do not emit group X.509 identities, so do it here.
          # Guarded on GroupX509 presence -> no-op for callers without a group.
          if ($TestEnvInfo.Dps.Enrollments.GroupX509.Count -gt 0) {
              $group = $TestEnvInfo.Dps.Enrollments.GroupX509[0]
              # Reuse a device identity minted during provisioning; mint one only if
              # the group has none (both paths produce a leaf signed by the issuer CA).
              if ($group.Identities.Count -gt 0) {
                  $identity = $group.Identities[0]
              } else {
                  $identity = $group.AddIdentity("csr-bootstrap-$(Get-Random -Minimum 100000 -Maximum 999999)", [timespan]::FromDays(2))
              }
              $regId = $identity.Id
              $chainPem = $identity.Certificate.ToPem() + "`n" + $group.Certificate.ToPem() + "`n" + $TestEnvInfo.Dps.RootCaCertificates[0].ToPem()
              $keyPem = $identity.Certificate.PrivateKey.ToRsaPkcs1Pem()
              $certB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($chainPem))
              $keyB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($keyPem))
              if ($ConfigTarget -eq 'powershell') {
                  Add-Content -Path $OutFile -Value "`$env:IOT_DPS_GROUP_X509_CERTIFICATE = `"$certB64`""
                  Add-Content -Path $OutFile -Value "`$env:IOT_DPS_GROUP_X509_KEY = `"$keyB64`""
                  Add-Content -Path $OutFile -Value "`$env:IOT_DPS_GROUP_X509_REGISTRATION_ID = `"$regId`""
              } else {
                  Add-Content -Path $OutFile -Value "export IOT_DPS_GROUP_X509_CERTIFICATE=`"$certB64`""
                  Add-Content -Path $OutFile -Value "export IOT_DPS_GROUP_X509_KEY=`"$keyB64`""
                  Add-Content -Path $OutFile -Value "export IOT_DPS_GROUP_X509_REGISTRATION_ID=`"$regId`""
              }
              Write-Host "Emitted X.509 group bootstrap identity: $regId"
          }
