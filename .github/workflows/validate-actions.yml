# Contract checks for the composite actions under actions/ and the Azure
# Pipelines templates other repositories consume. No Azure credentials and no
# deployment: both are consumed by other repositories, so the point is to catch
# a broken contract here rather than in someone else's pipeline.
name: Validate actions

on:
  push:
    branches: [master]
    paths:
      - 'actions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'vsts/templates/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'actions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'vsts/templates/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate action contracts
        run: |
          npm install --no-save js-yaml@4
          node tests/validate-actions.mjs

      - name: Test file-upload provisioning flow
        shell: pwsh
        run: ./tests/Test-FileUploadProvisioning.ps1

      - name: Test Event Hub telemetry route
        shell: pwsh
        run: ./tests/Test-TelemetryEventHubRoute.ps1

      - name: Test MQTT v5 provisioning
        shell: pwsh
        run: ./tests/Test-Mqttv5Provisioning.ps1

      - name: Test leftover resource group cleanup
        shell: pwsh
        run: ./tests/Test-ResourceGroupCleanup.ps1

      - name: Test shared enrollment groups
        shell: pwsh
        run: ./tests/Test-SharedEnrollmentGroups.ps1

      - name: Lint workflows
        run: |
          curl -sSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          # Workflow files only: actionlint parses composite action.yml as a
          # workflow and reports its 'runs'/'inputs' keys as errors.
          ./actionlint -no-color .github/workflows/*.yml
