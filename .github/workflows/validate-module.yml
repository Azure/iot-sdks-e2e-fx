# Checks the AzIotSdkTest module: parses every part, verifies the load order,
# imports the module and asserts its exported surface. Provisions nothing and
# needs no credentials -- the point is to catch a load-order or export mistake
# here rather than in a consuming repository's provisioning job.
name: Validate module

on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'tests/Validate-Module.ps1'
      - '.github/workflows/validate-module.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/Validate-Module.ps1'
      - '.github/workflows/validate-module.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Windows too: the Azure Pipelines templates import this module from Windows
    # PowerShell 5.1 (AzureCLI@2 with scriptType 'ps'), which pwsh on Linux would
    # not catch.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Two steps rather than `shell: ${{ matrix.shell }}`: `shell` is evaluated
      # before the matrix context exists, so an expression there is a workflow
      # file error rather than a job failure.
      - name: Validate module (PowerShell Core)
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./tests/Validate-Module.ps1

      - name: Validate module (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Validate-Module.ps1
