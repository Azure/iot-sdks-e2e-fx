name: $(BuildID)_pythonv2_$(BuildDefinitionName)_$(SourceBranchName)
variables:
  Horton.FrameworkRoot: $(Build.SourcesDirectory)

stages:
- stage: setup
  jobs:
  - job: create_azure_resources
    pool:
      vmImage: 'windows-latest'
    steps:
    - template: templates/steps-create-azure-resources.yaml

- stage: build_and_test
  dependsOn: setup
  jobs:
  - job: "build_linux_amd64"
    pool:
      vmImage: 'ubuntu-22.04'
    strategy:
      matrix:
        py311: { variant: py311 }
        py312: { variant: py312 }
        py313: { variant: py313 }
    steps:
    - template: templates/steps-load-test-config.yaml
    - template: templates/steps-build-docker-image.yaml
      parameters:
        variant: $(variant)

  - job: "test_linux_amd64"
    pool:
        vmImage: 'ubuntu-22.04'
    dependsOn:
      - "build_linux_amd64"
    strategy:
      maxParallel: 10
      matrix:
        py312_mqtt_iothub_module_and_device:          { suite: py312_mqtt_iothub_module_and_device }
        py312_mqtt_edgehub_module:                    { suite: py312_mqtt_edgehub_module }
        py312_mqtt_iothub_module_full_drop:           { suite: py312_mqtt_iothub_module_full_drop }
        py312_mqtt_iothub_device_full_drop:           { suite: py312_mqtt_iothub_device_full_drop }
        py312_mqtt_edgehub_module_full_drop:          { suite: py312_mqtt_edgehub_module_full_drop }

        py312_mqttws_iothub_module_and_device:        { suite: py312_mqttws_iothub_module_and_device }
        py312_mqttws_edgehub_module:                  { suite: py312_mqttws_edgehub_module }
        py312_mqttws_iothub_module_full_drop:         { suite: py312_mqttws_iothub_module_full_drop }
        py312_mqttws_iothub_device_full_drop:         { suite: py312_mqttws_iothub_device_full_drop }
        py312_mqttws_edgehub_module_full_drop:        { suite: py312_mqttws_edgehub_module_full_drop }

        py312_async_mqtt_iothub_module_and_device:    { suite: py312_async_mqtt_iothub_module_and_device }
        py312_async_mqtt_edgehub_module:              { suite: py312_async_mqtt_edgehub_module }
        py312_async_mqtt_iothub_module_full_drop:     { suite: py312_async_mqtt_iothub_module_full_drop }
        py312_async_mqtt_iothub_device_full_drop:     { suite: py312_async_mqtt_iothub_device_full_drop }
        py312_async_mqtt_edgehub_module_full_drop:    { suite: py312_async_mqtt_edgehub_module_full_drop }

        py312_async_mqttws_iothub_module_and_device:  { suite: py312_async_mqttws_iothub_module_and_device }
        py312_async_mqttws_edgehub_module:            { suite: py312_async_mqttws_edgehub_module }
        py312_async_mqttws_iothub_module_full_drop:   { suite: py312_async_mqttws_iothub_module_full_drop }
        py312_async_mqttws_iothub_device_full_drop:   { suite: py312_async_mqttws_iothub_device_full_drop }
        py312_async_mqttws_edgehub_module_full_drop:  { suite: py312_async_mqttws_edgehub_module_full_drop }

        py313_mqtt_iothub_module_and_device:          { suite: py313_mqtt_iothub_module_and_device }
        py313_mqtt_edgehub_module:                    { suite: py313_mqtt_edgehub_module }
        py313_mqtt_iothub_module_full_drop:           { suite: py313_mqtt_iothub_module_full_drop }
        py313_mqtt_iothub_device_full_drop:           { suite: py313_mqtt_iothub_device_full_drop }
        py313_mqtt_edgehub_module_full_drop:          { suite: py313_mqtt_edgehub_module_full_drop }

        py313_mqttws_iothub_module_and_device:        { suite: py313_mqttws_iothub_module_and_device }
        py313_mqttws_edgehub_module:                  { suite: py313_mqttws_edgehub_module }
        py313_mqttws_iothub_module_full_drop:         { suite: py313_mqttws_iothub_module_full_drop }
        py313_mqttws_iothub_device_full_drop:         { suite: py313_mqttws_iothub_device_full_drop }
        py313_mqttws_edgehub_module_full_drop:        { suite: py313_mqttws_edgehub_module_full_drop }

        py313_async_mqtt_iothub_module_and_device:    { suite: py313_async_mqtt_iothub_module_and_device }
        py313_async_mqtt_edgehub_module:              { suite: py313_async_mqtt_edgehub_module }
        py313_async_mqtt_iothub_module_full_drop:     { suite: py313_async_mqtt_iothub_module_full_drop }
        py313_async_mqtt_iothub_device_full_drop:     { suite: py313_async_mqtt_iothub_device_full_drop }
        py313_async_mqtt_edgehub_module_full_drop:    { suite: py313_async_mqtt_edgehub_module_full_drop }

        py313_async_mqttws_iothub_module_and_device:  { suite: py313_async_mqttws_iothub_module_and_device }
        py313_async_mqttws_edgehub_module:            { suite: py313_async_mqttws_edgehub_module }
        py313_async_mqttws_iothub_module_full_drop:   { suite: py313_async_mqttws_iothub_module_full_drop }
        py313_async_mqttws_iothub_device_full_drop:   { suite: py313_async_mqttws_iothub_device_full_drop }
        py313_async_mqttws_edgehub_module_full_drop:  { suite: py313_async_mqttws_edgehub_module_full_drop }

        py311_mqtt_iothub_module_and_device:          { suite: py311_mqtt_iothub_module_and_device }
        py311_mqtt_edgehub_module:                     { suite: py311_mqtt_edgehub_module }
        py311_mqtt_iothub_module_full_drop:            { suite: py311_mqtt_iothub_module_full_drop }
        py311_mqtt_iothub_device_full_drop:            { suite: py311_mqtt_iothub_device_full_drop }
        py311_mqtt_edgehub_module_full_drop:           { suite: py311_mqtt_edgehub_module_full_drop }

        py311_mqttws_iothub_module_and_device:         { suite: py311_mqttws_iothub_module_and_device }
        py311_mqttws_edgehub_module:                   { suite: py311_mqttws_edgehub_module }
        py311_mqttws_iothub_module_full_drop:          { suite: py311_mqttws_iothub_module_full_drop }
        py311_mqttws_iothub_device_full_drop:          { suite: py311_mqttws_iothub_device_full_drop }
        py311_mqttws_edgehub_module_full_drop:         { suite: py311_mqttws_edgehub_module_full_drop }

        py311_async_mqtt_iothub_module_and_device:     { suite: py311_async_mqtt_iothub_module_and_device }
        py311_async_mqtt_edgehub_module:               { suite: py311_async_mqtt_edgehub_module }
        py311_async_mqtt_iothub_module_full_drop:      { suite: py311_async_mqtt_iothub_module_full_drop }
        py311_async_mqtt_iothub_device_full_drop:      { suite: py311_async_mqtt_iothub_device_full_drop }
        py311_async_mqtt_edgehub_module_full_drop:     { suite: py311_async_mqtt_edgehub_module_full_drop }

        py311_async_mqttws_iothub_module_and_device:   { suite: py311_async_mqttws_iothub_module_and_device }
        py311_async_mqttws_edgehub_module:             { suite: py311_async_mqttws_edgehub_module }
        py311_async_mqttws_iothub_module_full_drop:    { suite: py311_async_mqttws_iothub_module_full_drop }
        py311_async_mqttws_iothub_device_full_drop:    { suite: py311_async_mqttws_iothub_device_full_drop }
        py311_async_mqttws_edgehub_module_full_drop:   { suite: py311_async_mqttws_edgehub_module_full_drop }

    steps:
    - template: templates/steps-load-test-config.yaml
    - template: templates/steps-deploy-and-run-pytest.yaml
      parameters:
        forced_image: $(Horton.ForcedImage)
        suite: $(suite)

- stage: cleanup
  dependsOn:
  - setup
  - build_and_test
  condition: always()
  jobs:
  - job: destroy_azure_resource_group
    condition: always()
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
    - template: templates/steps-destroy-azure-resources.yaml

