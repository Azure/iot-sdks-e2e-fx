jobs:
- job: "build_linux_amd64"
  pool:
    vmImage: 'ubuntu-22.04'
  strategy:
    matrix:
      py311: { variant: py311 }
      py312: { variant: py312 }
      py313: { variant: py313 }
  steps:
  - template: steps-load-test-config.yaml
  - template: steps-build-docker-image.yaml
    parameters:
      variant: $(variant)

- job: "test_linux_amd64"
  pool:
      vmImage: 'ubuntu-22.04'
  dependsOn:
    - "build_linux_amd64"
  strategy:
    matrix:
        py313_mqtt_iothub_module_and_device:        { suite: py313_mqtt_iothub_module_and_device }
        py313_mqttws_async_edgehub_module:          { suite: py313_mqttws_async_edgehub_module }
        py311_mqtt_edgehub_module:                   { suite: py311_mqtt_edgehub_module }
        py311_mqttws_async_iothub_module_and_device: { suite: py311_mqttws_async_iothub_module_and_device }
        py312_mqtt_async_edgehub_module:             { suite: py312_mqtt_async_edgehub_module }
        py312_mqtt_async_iothub_module_and_device:   { suite: py312_mqtt_async_iothub_module_and_device }
        py313_mqtt_iothub_module_quick_drop:        { suite: py313_mqtt_iothub_module_quick_drop }
        py311_mqtt_iothub_module_quick_drop:         { suite: py311_mqtt_iothub_module_quick_drop }
        py312_mqtt_iothub_device_quick_drop:         { suite: py312_mqtt_iothub_device_quick_drop }

  steps:
  - template: steps-load-test-config.yaml
  - template: steps-deploy-and-run-pytest.yaml
    parameters:
      suite: $(suite)

