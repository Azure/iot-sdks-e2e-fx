steps:
- checkout: none

- download: current
  artifact: test_config
  displayName: Download artifact (test config)

- task: AzureCLI@2
  inputs:
    azureSubscription: 'iot hub sdk service connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e
      export AZURE_RESOURCE_GROUP=$(cat "$(Pipeline.Workspace)/test_config/azure-resource-group-name.txt")
      echo "Deleting Azure resource group: $AZURE_RESOURCE_GROUP"
      az group delete --name $AZURE_RESOURCE_GROUP --yes --no-wait
  displayName: Destroy Azure Resource Group
  condition: always()

- task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
  displayName: 'Component Detection'
  inputs:
    sourceScanPath: '$(Build.ArtifactStagingDirectory)' # Scan an empty directory so that component governance is effectively disabled
    alertWarningLevel: Never
    # This pipeline uses packages that may not be included in shipped packages, so do not file component governance alerts for out-of-date components. Component governance is
    # still run in CI pipelines to catch component governance issues in shipped packages.
