parameters:
  language: ''
  repo_address: $(IOTHUB-E2E-REPO-ADDRESS)
  repo_user: $(IOTHUB-E2E-REPO-USER)
  repo_password: $(IOTHUB-E2E-REPO-PASSWORD)
  image_friendMod: $(IOTHUB-E2E-REPO-ADDRESS)/default-friend-module:$(Architecture)-v2
  image_testMod: ''
  test_image_tag: ''
  deployment_type: ''
  
steps:
- bash: ${HORTON_FRAMEWORKROOT}/scripts/new/install-prereqs.sh
  displayName: 'Install prerequisites'
  condition: and(succeeded(), ne(variables['skipTest'],'yes'), eq(variables['deploymentType'], 'iotedge'))

- bash: |
    # docker login to ACR can transiently time out ("request canceled while
    # waiting for connection").  Retry with backoff so a single network blip
    # does not fail the whole job.
    retry() {
      local max=5 delay=10 n=1
      until "$@"; do
        if [ "$n" -ge "$max" ]; then
          echo "Command failed after $n attempts: $1" >&2
          return 1
        fi
        echo "Attempt $n failed. Retrying in ${delay}s..." >&2
        sleep "$delay"
        n=$((n + 1))
      done
    }
    retry docker login -u ${{ parameters.repo_user }} -p ${{ parameters.repo_password }} ${{ parameters.repo_address }}
    if [ $(which sudo) ]; then 
      retry sudo docker login -u ${{ parameters.repo_user }} -p ${{ parameters.repo_password }} ${{ parameters.repo_address }}
    fi
  displayName: 'docker login'
  condition: and(succeeded(), ne(variables['skipTest'],'yes'), eq(variables['usesDocker'], 'yes'))

- bash: 
    ${HORTON_FRAMEWORKROOT}/bin/horton deploy ${{ parameters.deployment_type }} image ${{ parameters.image_testMod }}
  displayName: 'Create new identites and deploy containers (docker)'
  env:
    IOTHUB_E2E_REPO_ADDRESS: $(IOTHUB-E2E-REPO-ADDRESS)
    IOTHUB_E2E_REPO_USER: $(IOTHUB-E2E-REPO-USER)
    IOTHUB_E2E_REPO_PASSWORD: $(IOTHUB-E2E-REPO-PASSWORD)
    IOTHUB_E2E_CONNECTION_STRING: $(IOTHUB-E2E-CONNECTION-STRING)
    IOTEDGE_DEBUG_LOG: $(IOTEDGE_DEBUG_LOG)
  condition: and(succeeded(), ne(variables['skipTest'],'yes'), eq(variables['usesDocker'],'yes'))

- bash: |
    cd ${HORTON_FRAMEWORKROOT}/scripts/new/ &&
    ./wait-for-container.sh edgeHub &&
    ./wait-for-container.sh edgeAgent &&
    ./wait-for-container.sh friendMod 
  displayName: 'wait for iot edge containers'
  condition: and(succeeded(), ne(variables['skipTest'],'yes'), eq(variables['deploymentType'], 'iotedge'))

- bash: |
    cd ${HORTON_FRAMEWORKROOT}/scripts/new/ &&
    ./wait-for-container.sh testMod
  displayName: 'wait for testMod container'
  condition: and(succeeded(), ne(variables['skipTest'],'yes'), eq(variables['usesDocker'],'yes'))

- bash: sleep 30
  displayName: '30 seconds to start up'
  condition: and(succeeded(), ne(variables['skipTest'],'yes'))

- bash: |
    # IoT Hub takes 2-164+ seconds (unpredictable) to propagate auth
    # chains for a newly created edge device scope tree.  EdgeHub cannot
    # create cloud proxies for leaf devices until this propagation
    # completes.  With DeviceScopeCacheRefreshRateSecs=10 EdgeHub polls
    # IoT Hub every 10 seconds, so it will pick up the auth chains as
    # soon as they're available.
    #
    # Instead of destroying EdgeHub (cold start = restart the clock on
    # scope cache population), we keep the original instance running and
    # poll its logs until we see testMod in the scope cache — this means
    # the full scope tree has propagated and all identities (including
    # the leaf device) have valid auth chains.
    #
    # This adaptive wait exits instantly when propagation is fast (2s)
    # and waits up to 5 minutes in the worst case, avoiding both wasted
    # time and premature test starts.
    echo "Waiting for EdgeHub scope cache to be fully populated..."
    MAX_WAIT=30  # 30 x 10s = 5 minutes max
    for i in $(seq 1 $MAX_WAIT); do
      if docker logs edgeHub 2>&1 | grep -qE '(Add|Not changed) node: .*/testMod'; then
        echo "EdgeHub scope cache ready (testMod found after $((i * 10 - 10))s)"
        break
      fi
      if [ "$i" -eq "$MAX_WAIT" ]; then
        echo "WARNING: EdgeHub scope cache not fully populated after $((MAX_WAIT * 10))s. Proceeding anyway."
      else
        echo "Scope cache not yet populated (attempt $i/$MAX_WAIT). Waiting 10s..."
        sleep 10
      fi
    done
  displayName: 'Wait for EdgeHub scope cache propagation'
  condition: and(succeeded(), ne(variables['skipTest'],'yes'), eq(variables['deploymentType'], 'iotedge'))

- bash: 
    ${HORTON_FRAMEWORKROOT}/bin/horton get_credentials
  displayName: 'Get credentials'
  condition: and(succeeded(), ne(variables['skipTest'],'yes'))

