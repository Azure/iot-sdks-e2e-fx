parameters:
  azure_location: 'centraluseuap'

steps:
- checkout: none

- template: steps-ensure-e2e-fx-repo.yaml

- task: AzureCLI@2
  inputs:
    azureSubscription: 'iot hub sdk service connection'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      Import-Module "$(Horton.FrameworkRoot)/scripts/Azure.Iot.Sdk.Test.psm1"

      $ResourceGroupName = New-AzureResourceGroupName -OutFile "test_config/azure-resource-group-name.txt"
      $TestEnvInfo = New-AzIotTestEnvironment -AzureLocation "${{ parameters.azure_location }}" -ResourceGroup $ResourceGroupName -NoDps -AddContainerRegistry -EnableFileUpload
      New-AzIotHortonTestConfig -TestEnvInfo $TestEnvInfo -Target bash -OutFile test_config/set_horton_env_vars.sh
  displayName: Create Azure Resources and Test Config

- publish: test_config
  artifact: test_config
  displayName: Publish artifact (test config)
  condition: always()

- task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
  displayName: 'Component Detection'
  inputs:
    detectorsFilter: './docker_images/java'
    alertWarningLevel: Never
    # This pipeline uses packages that may not be included in shipped packages, so do not file component governance alerts for out-of-date components. Component governance is
    # still run in CI pipelines to catch component governance issues in shipped packages.
